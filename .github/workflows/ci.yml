name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:ci

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install plugin Python runtime
        run: python -m pip install uv==0.12.5

      - name: Exercise published plugins on this OS
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        run: npx vitest run test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts

  package-director-test-windows:
    name: Package Director prototype · Windows x64
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run focused Director boundary tests
        run: npx vitest run test/director-authority.test.ts test/tools-browser.test.ts

      - name: Package Windows x64 test installer
        run: npm run dist:x64

      - name: Smoke packaged runtime natively
        run: node scripts/smoke-packaged-runtime.mjs --platform win32 --arch x64

      - name: Write test artifact checksum
        shell: pwsh
        run: |
          $path = 'release/Chat-On-Steroids-Setup-x64.exe'
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Chat-On-Steroids-Setup-x64.exe" | Set-Content -Encoding ascii release/SHA256-DIRECTOR-TEST.txt
          Get-Content release/SHA256-DIRECTOR-TEST.txt

      - name: Upload Director prototype installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: director-authority-windows-x64-${{ github.run_id }}
          path: |
            release/Chat-On-Steroids-Setup-x64.exe
            release/SHA256-DIRECTOR-TEST.txt
          if-no-files-found: error
          retention-days: 14
